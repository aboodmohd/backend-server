services:
  - type: web
    name: video-sniff
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RESOLVE_TIMEOUT_MS
        value: 30000
      - key: NOVA_SKIP_BROWSER_WARMUP
        value: 0
